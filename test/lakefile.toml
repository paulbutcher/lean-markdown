name = "test"
defaultTargets = ["TestData"]
testDriver = "TestData"

[[require]]
name = "markdown"
path = ".."

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.32.0"

[[lean_lib]]
name = "TestData"
globs = ["CheckExample", "SpecGuards", "ZipperLaws", "ParserLaws", "HtmlWellFormedness",
  "CheckExampleGfm", "GfmGuards", "GfmRegressionGuards", "GfmNonEmissionProperties",
  "GfmHtmlWellFormedness", "SanitizeSafety", "GfmSanitizeSafety", "SanitizeExamples",
  "EntityReferenceExamples", "CaseFoldingExamples"]
