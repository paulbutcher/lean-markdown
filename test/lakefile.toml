name = "test"
defaultTargets = ["TestData"]
testDriver = "TestData"

[leanOptions]
warningAsError = true

[[require]]
name = "markdown"
path = ".."

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.34.0"

[[lean_lib]]
name = "TestData"
globs = ["CheckExample", "SpecGuards", "NoEmbeddedHtml", "GfmNoEmbeddedHtml", "AstFuelLaws", "GfmAstFuelLaws",
  "RenderSafeWellFormedness", "GfmRenderSafeWellFormedness", "UriSchemeLaws",
  "SanitizeIdempotence", "GfmSanitizeIdempotence",
  "ZipperLaws", "ParserLaws", "HtmlWellFormedness",
  "CheckExampleGfm", "GfmGuards", "GfmRegressionGuards", "GfmNonEmissionProperties",
  "GfmHtmlWellFormedness", "SanitizeSafety", "GfmSanitizeSafety", "SanitizeExamples",
  "CheckExampleMath", "MathGuards", "MathInteractionGuards", "MathDivergenceGuards",
  "MathProperties",
  "EntityReferenceExamples", "CaseFoldingExamples"]
