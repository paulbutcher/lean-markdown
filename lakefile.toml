name = "markdown"
version = "0.1.0"
defaultTargets = ["CommonMark", "GFMarkdown"]
testDriver = "TestData"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.32.0"

[[require]]
name = "html"
git = "https://github.com/paulbutcher/lean-html"
rev = "v0.5.0"

[[lean_lib]]
name = "CommonMark"

[[lean_lib]]
name = "GFMarkdown"

[[lean_lib]]
name = "TestData"
srcDir = "test"
globs = ["CheckExample", "SpecGuards", "ZipperLaws", "ParserLaws", "HtmlWellFormedness",
  "CheckExampleGfm", "GfmGuards"]
